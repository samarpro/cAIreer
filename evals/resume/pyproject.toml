[project]
name = "caireer-resume-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pymupdf>=1.28,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
resume-eval = "resume_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
